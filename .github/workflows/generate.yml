name: Generate HuangLi ICS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install lunar_python

      - name: Run generation script
        run: |
          python3 -c '
          from datetime import date, timedelta
          from lunar_python import Solar

          # 动态获取今天，并计算往后 3 个月（约 92 天）的范围
          start_date = date.today()
          end_date = start_date + timedelta(days=92)

          # 八卦与现代白话翻译映射
          def translate_bagua(raw):
              if not raw:
                  return "无特定方位"
              
              mapping = {
                  "坎": "正北方",
                  "离": "正南方",
                  "震": "正东方",
                  "兑": "正西方",
                  "乾": "西北方",
                  "坤": "西南方",
                  "巽": "东南方",
                  "艮": "东北方",
                  "中": "中央/中间"
              }
              
              translated = raw
              for k, v in mapping.items():
                  translated = translated.replace(k, v)
              
              translated = translated.replace("房", "房间").replace("床", "床铺").replace("门", "大门").replace("碓", "石磨").replace("磨", "磨盘").replace("灶", "灶台").replace("仓", "仓库").replace("厨", "厨房")
              return f"{raw} （白话：{translated}）"

          lines = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//Custom//HuangLi Detail//CN",
              "CALSCALE:GREGORIAN",
              "X-WR-CALNAME:每日黄历",
              "X-WR-TIMEZONE:Asia/Shanghai"
          ]

          cur = start_date
          while cur <= end_date:
              solar = Solar.fromYmd(cur.year, cur.month, cur.day)
              lunar = solar.getLunar()
              
              yi = ".".join(lunar.getDayYi()) or "无"
              ji = ".".join(lunar.getDayJi()) or "无"
              
              # 神位：显示汉字方位
              xi = lunar.getDayPositionXiDesc() or lunar.getDayPositionXi()
              fu = lunar.getDayPositionFuDesc() or lunar.getDayPositionFu()
              cai = lunar.getDayPositionCaiDesc() or lunar.getDayPositionCai()
              direction_data = f"喜神: {xi} | 福神: {fu} | 财神: {cai}"
              
              # 详细冲煞
              chong = lunar.getDayChong()
              chong_shengxiao = lunar.getDayChongShengXiao()
              sha = lunar.getDaySha()
              chong_sha = f"冲{chong}岁(生肖{chong_shengxiao}), 煞{sha}"

              # 获取胎神并白话翻译
              taishen_raw = ""
              try:
                  taishen_raw = lunar.getDayPositionTaiSui()
              except:
                  taishen_raw = "离"
              
              if not taishen_raw:
                  taishen_raw = "离"

              taishen = translate_bagua(taishen_raw)

              date_str = cur.strftime("%Y年%m月%d日")
              d_str = cur.strftime("%Y%m%d")
              nxt_str = (cur + timedelta(days=1)).strftime("%Y%m%d")
              
              desc = f"{date_str}\\n\\n【宜】\\n{yi}\\n\\n【忌】\\n{ji}\\n\\n【神位】\\n{direction_data}\\n\\n【冲煞】\\n{chong_sha}\\n\\n【胎神】\\n{taishen}"
              
              lines.extend([
                  "BEGIN:VEVENT",
                  f"UID:huangli-{d_str}@local",
                  f"DTSTAMP:{d_str}T000000Z",
                  f"DTSTART;VALUE=DATE:{d_str}",
                  f"DTEND;VALUE=DATE:{nxt_str}",
                  "SUMMARY:每日黄历",
                  f"DESCRIPTION:{desc}",
                  "TRANSP:TRANSPARENT",
                  "END:VEVENT"
              ])
              cur += timedelta(days=1)

          lines.append("END:VCALENDAR")
          with open("huangli.ics", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          print("动态3个月黄历ics文件生成成功！")
          '

      - name: Commit and push generated file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add huangli.ics
          git commit -m "Auto update: rolling next 3 months daily" || exit 0
          git push
