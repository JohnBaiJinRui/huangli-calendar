name: Generate HuangLi ICS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install lunar_python

      - name: Run generation script
        run: |
          python3 -c '
          from datetime import date, timedelta
          from lunar_python import Solar

          start_year = 2026
          end_year = 2029

          # 胎神白话文翻译辅助函数
          def translate_taishen(raw_text):
              if not raw_text or raw_text == "无":
                  return "无特定方位"
              
              # 常见关键词替换与白话文润色
              s = raw_text
              s = s.replace("占", "位置在：")
              s = s.replace("房", "房间")
              s = s.replace("床", "床铺")
              s = s.replace("门", "大门/房门")
              s = s.replace("碓", "石磨旁")
              s = s.replace("磨", "磨盘旁")
              s = s.replace("灶", "灶台")
              s = s.replace("厕", "厕所")
              s = s.replace("仓", "仓库")
              s = s.replace("厨", "厨房")
              s = s.replace("仓库", "仓库")
              s = s.replace("外", "室外/外面")
              s = s.replace("内", "室内")
              s = s.replace("东", "正东方")
              s = s.replace("南", "正南方")
              s = s.replace("西", "正西方")
              s = s.replace("北", "正北方")
              s = s.replace("中", "中央/中间")
              
              return f"{raw_text} （白话：{s}）"

          lines = [
              "BEGIN:VCALENDAR",
              "VERSION:2.0",
              "PRODID:-//Custom//HuangLi Detail//CN",
              "CALSCALE:GREGORIAN",
              "X-WR-CALNAME:每日黄历",
              "X-WR-TIMEZONE:Asia/Shanghai"
          ]

          cur = date(start_year, 1, 1)
          end = date(end_year, 12, 31)

          while cur <= end:
              solar = Solar.fromYmd(cur.year, cur.month, cur.day)
              lunar = solar.getLunar()
              
              yi = ".".join(lunar.getDayYi()) or "无"
              ji = ".".join(lunar.getDayJi()) or "无"
              
              # 神位：显示汉字方位
              xi = lunar.getDayPositionXiDesc() or lunar.getDayPositionXi()
              fu = lunar.getDayPositionFuDesc() or lunar.getDayPositionFu()
              cai = lunar.getDayPositionCaiDesc() or lunar.getDayPositionCai()
              direction_data = f"喜神: {xi} | 福神: {fu} | 财神: {cai}"
              
              # 详细冲煞
              chong = lunar.getDayChong()
              chong_shengxiao = lunar.getDayChongShengXiao()
              sha = lunar.getDaySha()
              chong_sha = f"冲{chong}岁(生肖{chong_shengxiao}), 煞{sha}"

              # 获取胎神并翻译为白话文
              raw_taishen = lunar.getDayTaishen()
              taishen = translate_taishen(raw_taishen)

              date_str = cur.strftime("%Y年%m月%d日")
              d_str = cur.strftime("%Y%m%d")
              nxt_str = (cur + timedelta(days=1)).strftime("%Y%m%d")
              
              desc = f"{date_str}\\n\\n【宜】\\n{yi}\\n\\n【忌】\\n{ji}\\n\\n【神位】\\n{direction_data}\\n\\n【冲煞】\\n{chong_sha}\\n\\n【胎神】\\n{taishen}"
              
              lines.extend([
                  "BEGIN:VEVENT",
                  f"UID:huangli-{d_str}@local",
                  f"DTSTAMP:{d_str}T000000Z",
                  f"DTSTART;VALUE=DATE:{d_str}",
                  f"DTEND;VALUE=DATE:{nxt_str}",
                  "SUMMARY:每日黄历",
                  f"DESCRIPTION:{desc}",
                  "TRANSP:TRANSPARENT",
                  "END:VEVENT"
              ])
              cur += timedelta(days=1)

          lines.append("END:VCALENDAR")
          with open("huangli.ics", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          print("黄历ics文件生成成功！")
          '

      - name: Commit and push generated file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add huangli.ics
          git commit -m "Add baihuawen translation for taishen" || exit 0
          git push
